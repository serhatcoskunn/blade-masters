services:
  orbitblade-server:
    build:
      context: ./server
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - "2567"
    environment:
      - PORT=2567
      - NODE_ENV=production

  orbitblade-client:
    build:
      context: ./client
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - orbitblade-server
    expose:
      - "80"
