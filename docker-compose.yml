services:
  orbitblade-server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: orbitblade-server
    restart: unless-stopped
    ports:
      - "${SERVER_PORT:-2567}:2567"
    environment:
      - PORT=2567
      - NODE_ENV=production
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--spider", "http://127.0.0.1:2567/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  orbitblade-client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: orbitblade-client
    restart: unless-stopped
    depends_on:
      - orbitblade-server
    ports:
      - "${CLIENT_PORT:-8080}:80"
