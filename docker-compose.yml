services:
  orbitblade-server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: orbitblade-server
    restart: unless-stopped
    ports:
      - "${SERVER_PORT:-2567}:2567"
    environment:
      - PORT=2567
      - NODE_ENV=production

  orbitblade-client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: orbitblade-client
    restart: unless-stopped
    depends_on:
      - orbitblade-server
    ports:
      - "${CLIENT_PORT:-8080}:80"
